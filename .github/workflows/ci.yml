name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        run: flake8 backend tests
      - name: Format
        run: black --check backend tests
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # react-day-picker 8 (used only by the unused ui/calendar.jsx) declares date-fns ^2 or ^3 as a peer,
      # but package.json pins date-fns 4.1.0, so npm refuses a strict install until that is resolved.
      - run: npm ci --legacy-peer-deps
      - name: Build
        # Create React App turns lint warnings into errors when CI=true; this job checks that the app compiles.
        run: CI=false npm run build
        env:
          REACT_APP_BACKEND_URL: http://localhost:8001
